name: Tests
on: [push]

permissions:
    contents: read

# A second push supersedes the first. Separate from the Code Quality group so the
# two workflows cancel independently.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    jest:
        name: JavaScript unit tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Jest
              run: pnpm test:unit

    phpunit:
        name: PHP unit tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Matches the platform pin in composer.json, so CI resolves the same
            # dependency tree the plugin ships against.
            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.0'
                  coverage: none
                  tools: composer

            - name: Install Composer dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  composer-options: --dev --optimize-autoloader

            - name: Run PHPUnit
              run: composer test

    # `secrets` is not readable from a job level `if`, so the gate has to be a job
    # that reads them and publishes a plain output.
    e2e-environment:
        name: E2E environment check
        runs-on: ubuntu-latest
        outputs:
            configured: ${{ steps.check.outputs.configured }}
        steps:
            - name: Look for the E2E secret
              id: check
              env:
                  MONEI_TEST_API_KEY: ${{ secrets.MONEI_TEST_API_KEY }}
              run: |
                  if [ -n "$MONEI_TEST_API_KEY" ]; then
                    echo 'configured=true' >> "$GITHUB_OUTPUT"
                  else
                    echo 'configured=false' >> "$GITHUB_OUTPUT"
                    echo '::notice title=E2E skipped::The E2E suite takes real MONEI test payments, so it only runs where MONEI_TEST_API_KEY is set. See tests/playwright/README.md.'
                  fi

    e2e:
        name: E2E tests (Playwright)
        runs-on: ubuntu-latest
        needs: e2e-environment
        # A fork or a clone has no MONEI account behind it. Skipping keeps their runs
        # green instead of failing on a missing key.
        if: needs.e2e-environment.outputs.configured == 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # wp-env mounts this checkout as the plugin, so the runner has to hold
            # everything the plugin loads at runtime: the Composer autoloader and
            # the built front end assets, neither of which is committed.
            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.0'
                  coverage: none
                  tools: composer

            - name: Install Composer dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  composer-options: --no-dev --optimize-autoloader

            - name: Build assets
              run: pnpm build

            - name: Start WordPress
              run: pnpm exec wp-env start

            - name: Seed the store
              env:
                  MONEI_TEST_API_KEY: ${{ secrets.MONEI_TEST_API_KEY }}
                  MONEI_TEST_ACCOUNT_ID: ${{ secrets.MONEI_TEST_ACCOUNT_ID }}
              run: pnpm test:e2e:seed

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            - name: Run Playwright
              run: pnpm test:e2e

            - name: Upload the report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: playwright-report
                  path: tests/playwright/playwright-report
                  retention-days: 7
